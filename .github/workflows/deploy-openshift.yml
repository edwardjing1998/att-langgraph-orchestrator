name: Deploy LangGraph Orchestrator to OpenShift

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "openshift/**"
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/deploy-openshift.yml"

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
      OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
      APP_API_KEY: ${{ secrets.APP_API_KEY }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_POLICY_INDEX: ${{ vars.DATABRICKS_POLICY_INDEX }}
      DATABRICKS_BILLING_INDEX: ${{ vars.DATABRICKS_BILLING_INDEX }}
      DATABRICKS_CHAT_ENDPOINT: ${{ vars.DATABRICKS_CHAT_ENDPOINT }}
      SNOWFLAKE_HOST: ${{ vars.SNOWFLAKE_HOST }}
      SNOWFLAKE_CORTEX_DATABASE: ${{ vars.SNOWFLAKE_CORTEX_DATABASE }}
      SNOWFLAKE_CORTEX_SCHEMA: ${{ vars.SNOWFLAKE_CORTEX_SCHEMA }}
      SNOWFLAKE_CORTEX_SERVICE: ${{ vars.SNOWFLAKE_CORTEX_SERVICE }}
      LLM_ENABLED: ${{ vars.LLM_ENABLED }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Install OpenShift CLI
        uses: redhat-actions/oc-installer@v1
        with:
          oc_version: "4.18"

      - name: Validate deployment configuration
        shell: bash
        run: |
          required=(
            OPENSHIFT_SERVER OPENSHIFT_TOKEN OPENSHIFT_NAMESPACE
            DATABRICKS_TOKEN SNOWFLAKE_PAT DATABRICKS_HOST
            DATABRICKS_POLICY_INDEX DATABRICKS_BILLING_INDEX
            SNOWFLAKE_HOST SNOWFLAKE_CORTEX_DATABASE
            SNOWFLAKE_CORTEX_SCHEMA SNOWFLAKE_CORTEX_SERVICE
          )
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done
          echo "::add-mask::$DATABRICKS_TOKEN"
          echo "::add-mask::$SNOWFLAKE_PAT"
          if [ -n "$APP_API_KEY" ]; then echo "::add-mask::$APP_API_KEY"; fi
          if [ -z "$LLM_ENABLED" ]; then echo "LLM_ENABLED=false" >> "$GITHUB_ENV"; fi

      - name: Log in to OpenShift
        run: |
          oc login "$OPENSHIFT_SERVER" \
            --token="$OPENSHIFT_TOKEN" \
            --insecure-skip-tls-verify=true
          oc project "$OPENSHIFT_NAMESPACE"

      - name: Create or update runtime secrets
        shell: bash
        run: |
          oc create secret generic att-langgraph-orchestrator-secrets \
            --from-literal=DATABRICKS_TOKEN="$DATABRICKS_TOKEN" \
            --from-literal=SNOWFLAKE_PAT="$SNOWFLAKE_PAT" \
            --from-literal=APP_API_KEY="$APP_API_KEY" \
            --dry-run=client -o yaml | oc apply -f -

      - name: Apply build resources
        run: oc apply -f openshift/buildconfig.yaml

      - name: Build image inside OpenShift
        run: |
          oc start-build att-langgraph-orchestrator \
            --from-dir=. \
            --follow \
            --wait

      - name: Apply runtime resources
        shell: bash
        run: |
          envsubst < openshift/configmap.yaml | oc apply -f -
          envsubst < openshift/deployment.yaml | oc apply -f -
          oc apply -f openshift/service.yaml
          oc apply -f openshift/route.yaml
          oc rollout restart deployment/att-langgraph-orchestrator
          oc rollout status deployment/att-langgraph-orchestrator --timeout=5m

      - name: Smoke test
        shell: bash
        run: |
          ROUTE_HOST=$(oc get route att-langgraph-orchestrator -o jsonpath='{.spec.host}')
          APP_URL="https://${ROUTE_HOST}"
          echo "Application URL: $APP_URL"
          curl --retry 10 --retry-delay 5 --retry-all-errors \
            --fail-with-body "$APP_URL/health/ready"

