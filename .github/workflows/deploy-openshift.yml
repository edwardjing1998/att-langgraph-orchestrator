
name: Deploy LangGraph Orchestrator to OpenShift

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "openshift/**"
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/deploy-openshift.yml"

permissions:
  contents: read

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    environment: staging

    env:
      # Existing OpenShift credentials
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
      OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}

      # Existing application secrets (unchanged)
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
      APP_API_KEY: ${{ secrets.APP_API_KEY }}

      # Existing Databricks workspace (unchanged)
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_POLICY_INDEX: ${{ vars.DATABRICKS_POLICY_INDEX }}
      DATABRICKS_BILLING_INDEX: ${{ vars.DATABRICKS_BILLING_INDEX }}
      DATABRICKS_CHAT_ENDPOINT: ${{ vars.DATABRICKS_CHAT_ENDPOINT }}

      # NEW: Education Azure Databricks workspace
      EDUCATION_DATABRICKS_HOST: ${{ vars.EDUCATION_DATABRICKS_HOST }}
      EDUCATION_SEARCH_INDEX: ${{ vars.EDUCATION_SEARCH_INDEX }}
      EDUCATION_CHAT_ENDPOINT: ${{ vars.EDUCATION_CHAT_ENDPOINT }}

      # Existing Snowflake configuration (unchanged)
      SNOWFLAKE_HOST: ${{ vars.SNOWFLAKE_HOST }}
      SNOWFLAKE_CORTEX_DATABASE: ${{ vars.SNOWFLAKE_CORTEX_DATABASE }}
      SNOWFLAKE_CORTEX_SCHEMA: ${{ vars.SNOWFLAKE_CORTEX_SCHEMA }}
      SNOWFLAKE_CORTEX_SERVICE: ${{ vars.SNOWFLAKE_CORTEX_SERVICE }}

      LLM_ENABLED: ${{ vars.LLM_ENABLED }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Display Python version
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        run: pytest -q

      # Install OpenShift CLI directly from official mirror.
      - name: Install OpenShift CLI
        shell: bash
        run: |
          set -euo pipefail

          OC_DOWNLOAD_DIR="$RUNNER_TEMP/openshift-client"
          OC_INSTALL_DIR="$HOME/.local/bin"
          OC_ARCHIVE="$OC_DOWNLOAD_DIR/openshift-client-linux.tar.gz"
          OC_DOWNLOAD_URL="https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest-4.18/openshift-client-linux.tar.gz"

          mkdir -p "$OC_DOWNLOAD_DIR"
          mkdir -p "$OC_INSTALL_DIR"

          echo "Downloading OpenShift CLI from:"
          echo "$OC_DOWNLOAD_URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --output "$OC_ARCHIVE" \
            "$OC_DOWNLOAD_URL"

          tar \
            --extract \
            --gzip \
            --file "$OC_ARCHIVE" \
            --directory "$OC_DOWNLOAD_DIR"

          test -f "$OC_DOWNLOAD_DIR/oc" || {
            echo "Downloaded archive does not contain oc"
            exit 1
          }

          install \
            --mode=0755 \
            "$OC_DOWNLOAD_DIR/oc" \
            "$OC_INSTALL_DIR/oc"

          echo "$OC_INSTALL_DIR" >> "$GITHUB_PATH"

          "$OC_INSTALL_DIR/oc" version --client

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          required_variables=(
            OPENSHIFT_SERVER
            OPENSHIFT_TOKEN
            OPENSHIFT_NAMESPACE
            DATABRICKS_TOKEN
            SNOWFLAKE_PAT
            DATABRICKS_HOST
            DATABRICKS_POLICY_INDEX
            DATABRICKS_BILLING_INDEX
            SNOWFLAKE_HOST
            SNOWFLAKE_CORTEX_DATABASE
            SNOWFLAKE_CORTEX_SCHEMA
            SNOWFLAKE_CORTEX_SERVICE

            # NEW Education configuration
            EDUCATION_DATABRICKS_HOST
            EDUCATION_SEARCH_INDEX
            EDUCATION_CHAT_ENDPOINT
          )

          for variable_name in "${required_variables[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "Missing required variable: $variable_name"
              exit 1
            fi
          done

          echo "::add-mask::$OPENSHIFT_TOKEN"
          echo "::add-mask::$DATABRICKS_TOKEN"
          echo "::add-mask::$SNOWFLAKE_PAT"

          if [ -n "${APP_API_KEY:-}" ]; then
            echo "::add-mask::$APP_API_KEY"
            echo "APP_API_KEY is configured."
          else
            echo "APP_API_KEY is not configured."
            echo "The /api/v1/ask endpoint will not require X-API-Key."
          fi

          if [ -z "${LLM_ENABLED:-}" ]; then
            echo "LLM_ENABLED=false" >> "$GITHUB_ENV"
            echo "LLM_ENABLED was not configured; using false."
          fi

          echo "Existing Databricks: $DATABRICKS_HOST"
          echo "Education Databricks: $EDUCATION_DATABRICKS_HOST"
          echo "Education index: $EDUCATION_SEARCH_INDEX"
          echo "Education chat: $EDUCATION_CHAT_ENDPOINT"

          echo "Deployment configuration validation completed."

      - name: Log in to OpenShift
        shell: bash
        run: |
          set -euo pipefail

          oc login "$OPENSHIFT_SERVER" \
            --token="$OPENSHIFT_TOKEN" \
            --insecure-skip-tls-verify=true

          oc project "$OPENSHIFT_NAMESPACE"

          echo "Authenticated OpenShift user:"
          oc whoami

          echo "Selected OpenShift project:"
          oc project --short

          echo "OpenShift client and server versions:"
          oc version

      # NEW: Make sure the Education OAuth Secret exists
      # before applying the Deployment.
      - name: Validate Education Databricks Secret
        shell: bash
        run: |
          set -euo pipefail

          SECRET_NAME="education-databricks-auth"

          oc get secret "$SECRET_NAME" \
            -n "$OPENSHIFT_NAMESPACE" \
            >/dev/null

          echo "Education Databricks Secret exists."

          CLIENT_ID_PRESENT="$(
            oc get secret "$SECRET_NAME" \
              -n "$OPENSHIFT_NAMESPACE" \
              -o go-template='{{if index .data "client-id"}}yes{{else}}no{{end}}'
          )"

          CLIENT_SECRET_PRESENT="$(
            oc get secret "$SECRET_NAME" \
              -n "$OPENSHIFT_NAMESPACE" \
              -o go-template='{{if index .data "client-secret"}}yes{{else}}no{{end}}'
          )"

          if [ "$CLIENT_ID_PRESENT" != "yes" ] || \
             [ "$CLIENT_SECRET_PRESENT" != "yes" ]; then
            echo "Education Secret is missing OAuth credentials."
            exit 1
          fi

          echo "Education OAuth credential keys are present."

      - name: Create or update runtime secrets
        shell: bash
        run: |
          set -euo pipefail

          # Existing application credentials remain unchanged.
          # Education credentials are managed in a separate Secret.
          oc create secret generic att-langgraph-orchestrator-secrets \
            --from-literal=DATABRICKS_TOKEN="$DATABRICKS_TOKEN" \
            --from-literal=SNOWFLAKE_PAT="$SNOWFLAKE_PAT" \
            --from-literal=APP_API_KEY="${APP_API_KEY:-}" \
            --dry-run=client \
            --output=yaml |
          oc apply -f -

          echo "Existing runtime Secret created or updated."

      - name: Apply OpenShift build resources
        shell: bash
        run: |
          set -euo pipefail

          oc apply -f openshift/buildconfig.yaml

          echo "OpenShift build resources:"
          oc get imagestream att-langgraph-orchestrator
          oc get buildconfig att-langgraph-orchestrator

      - name: Build image inside OpenShift
        shell: bash
        run: |
          set -euo pipefail

          oc start-build att-langgraph-orchestrator \
            --from-dir=. \
            --follow \
            --wait

          echo "Recent OpenShift builds:"
          oc get builds \
            --sort-by=.metadata.creationTimestamp |
          tail -n 10

      - name: Apply OpenShift runtime resources
        shell: bash
        run: |
          set -euo pipefail

          # Apply ConfigMap with all GitHub variable values.
          envsubst < openshift/configmap.yaml |
          oc apply -f -

          # Apply Deployment referencing both credential Secrets.
          envsubst < openshift/deployment.yaml |
          oc apply -f -

          oc apply -f openshift/service.yaml
          oc apply -f openshift/route.yaml

      - name: Restart and verify deployment
        shell: bash
        run: |
          set -euo pipefail

          oc rollout restart \
            deployment/att-langgraph-orchestrator

          oc rollout status \
            deployment/att-langgraph-orchestrator \
            --timeout=5m

          echo "Deployment:"
          oc get deployment att-langgraph-orchestrator

          echo "Pods:"
          oc get pods \
            -l app=att-langgraph-orchestrator \
            -o wide

          echo "Service:"
          oc get service att-langgraph-orchestrator

          echo "Route:"
          oc get route att-langgraph-orchestrator

      # NEW: Verify both Databricks configurations are present
      # in the actual running container.
      - name: Verify dual Databricks configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking existing Databricks workspace..."
          ACTUAL_LEGACY_HOST="$(
            oc exec deployment/att-langgraph-orchestrator \
              -- printenv DATABRICKS_HOST
          )"

          test "$ACTUAL_LEGACY_HOST" = "$DATABRICKS_HOST" || {
            echo "Existing Databricks host mismatch."
            exit 1
          }

          echo "Checking Education Databricks workspace..."
          ACTUAL_EDUCATION_HOST="$(
            oc exec deployment/att-langgraph-orchestrator \
              -- printenv EDUCATION_DATABRICKS_HOST
          )"

          test "$ACTUAL_EDUCATION_HOST" = \
            "$EDUCATION_DATABRICKS_HOST" || {
            echo "Education Databricks host mismatch."
            exit 1
          }

          echo "Checking Education Vector Search index..."
          ACTUAL_INDEX="$(
            oc exec deployment/att-langgraph-orchestrator \
              -- printenv EDUCATION_SEARCH_INDEX
          )"

          test "$ACTUAL_INDEX" = "$EDUCATION_SEARCH_INDEX" || {
            echo "Education index mismatch."
            exit 1
          }

          echo "Checking Education OAuth credentials..."
          oc exec deployment/att-langgraph-orchestrator -- \
            sh -c '
              test -n "${EDUCATION_DATABRICKS_CLIENT_ID:-}"
              test -n "${EDUCATION_DATABRICKS_CLIENT_SECRET:-}"
            '

          echo "Both Databricks environments are configured."
          echo "Existing: $ACTUAL_LEGACY_HOST"
          echo "Education: $ACTUAL_EDUCATION_HOST"
          echo "Index: $ACTUAL_INDEX"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail

          ROUTE_HOST="$(
            oc get route att-langgraph-orchestrator \
              -o jsonpath='{.spec.host}'
          )"

          test -n "$ROUTE_HOST" || {
            echo "OpenShift Route host is empty"
            exit 1
          }

          APP_URL="https://${ROUTE_HOST}"

          echo "Application URL: $APP_URL"
          echo "Testing liveness endpoint..."

          curl \
            --fail-with-body \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            "$APP_URL/health/live"

          echo
          echo "Testing readiness endpoint..."

          curl \
            --fail-with-body \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            "$APP_URL/health/ready"

          echo
          echo "OpenShift smoke test completed successfully."

      - name: Show diagnostics after failure
        if: failure()
        shell: bash
        run: |
          echo "Workflow failed. Collecting available diagnostics."

          if ! command -v oc >/dev/null 2>&1; then
            echo "oc command unavailable; skipping diagnostics."
            exit 0
          fi

          if ! oc whoami >/dev/null 2>&1; then
            echo "Not authenticated; skipping diagnostics."
            exit 0
          fi

          echo "Pods:"
          oc get pods \
            -l app=att-langgraph-orchestrator \
            -o wide || true

          echo "Deployment:"
          oc describe \
            deployment/att-langgraph-orchestrator || true

          echo "Recent events:"
          oc get events \
            --sort-by=.lastTimestamp |
          tail -n 50 || true

          echo "Application logs:"
          oc logs \
            deployment/att-langgraph-orchestrator \
            --tail=200 || true
