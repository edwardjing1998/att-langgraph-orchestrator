apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: att-langgraph-orchestrator
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: att-langgraph-orchestrator
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: att-langgraph-orchestrator:latest
  triggers: []

