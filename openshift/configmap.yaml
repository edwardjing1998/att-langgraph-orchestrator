apiVersion: v1
kind: ConfigMap
metadata:
  name: att-langgraph-orchestrator-config
data:
  APP_NAME: att-langgraph-orchestrator
  APP_ENV: staging
  LOG_LEVEL: INFO
  REQUEST_TIMEOUT_SECONDS: "30"
  DATABRICKS_HOST: "${DATABRICKS_HOST}"
  DATABRICKS_POLICY_INDEX: "${DATABRICKS_POLICY_INDEX}"
  DATABRICKS_BILLING_INDEX: "${DATABRICKS_BILLING_INDEX}"
  DATABRICKS_CHAT_ENDPOINT: "${DATABRICKS_CHAT_ENDPOINT}"
  EDUCATION_DATABRICKS_HOST: "https://adb-7405618365754751.11.azuredatabricks.net"
  EDUCATION_SEARCH_INDEX: "education_rag.gold.approved_content_index"
  EDUCATION_CHAT_ENDPOINT: "databricks-gpt-oss-120b"
  EDUCATION_QUERY_NORMALIZATION_ENABLED: "true"
  EDUCATION_CANDIDATE_MULTIPLIER: "3"
  # Set these to the approved Delta source table and a running SQL warehouse ID.
  EDUCATION_APPROVED_SOURCE_TABLE: "education_rag.gold.approved_search_documents"
  EDUCATION_SQL_WAREHOUSE_ID: "e00dde2fce183801"
  SNOWFLAKE_HOST: "${SNOWFLAKE_HOST}"
  SNOWFLAKE_CORTEX_DATABASE: "${SNOWFLAKE_CORTEX_DATABASE}"
  SNOWFLAKE_CORTEX_SCHEMA: "${SNOWFLAKE_CORTEX_SCHEMA}"
  SNOWFLAKE_CORTEX_SERVICE: "${SNOWFLAKE_CORTEX_SERVICE}"
  LLM_ENABLED: "${LLM_ENABLED}"
  MAX_RESULTS_PER_SOURCE: "3"

